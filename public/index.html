<!doctype html>
<!--
=====================================================================
  CCG · CONTROLE DE PEÇAS LOCADAS (Mills, SH e outros fornecedores)
  Arquivo único: index.html  ·  versão 2 (4 abas, controle por nota)
  ---------------------------------------------------------------
  Publicado no Firebase Hosting (plano gratuito Spark) junto com:
    sw.js (abre sem sinal), manifest.json e icons/ (app instalável).
  Sem FIREBASE_CONFIG o app abre em MODO DEMONSTRAÇÃO (dados só
  neste aparelho, com dados de exemplo).

  REGRAS DO FIRESTORE: leitura e escrita só para quem entrou.
  NENHUM SERVIÇO PAGO: Firestore e Auth no plano gratuito; projetos
  e DWG guardados dentro do Firestore (sem Storage); leitura de PDF
  (pdf.js) e de nota escaneada (tesseract.js) no próprio aparelho;
  planilha gerada com SheetJS.
=====================================================================
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peças CCG">
<title>Controle de Peças · CCG</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
// guarda o convite de instalação do navegador para mostrar no momento certo
window.__bip = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; window.dispatchEvent(new Event('bip-pronto')); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{
  --navy:#13152B; --dark:#212B2A; --dark2:#2F3B3A; --green:#AEC155; --green-d:#5E7020; --green-t:#3D4A12; --green-bg:#E9F0CF;
  --slate:#5B6E86; --bg:#F2F4EE; --card:#FFFFFF; --line:#D7DBD0; --line2:#EBEEE6; --muted:#4E5752; --soft:#E6EAE0; --hint:#8A9289;
  --y:#E8B400; --y-bg:#FFF1BF; --y-t:#5C4300;
  --ok:#1E8A5A; --ok-bg:#E3F1EA; --ok-t:#10543A;
  --blue:#3B5BDB; --blue-bg:#E6EBFB; --blue-t:#243B8F;
  --mag:#C2268A; --mag-bg:#FBE4F1; --mag-t:#7A1556;
  --orange:#C27A00; --orange-t:#7A4D00; --orange-bg:#FFF0D6;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--navy)}
button{cursor:pointer}
a{color:var(--navy)}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
@media (min-width:760px){.app{box-shadow:0 0 0 1px var(--line)}}

/* cabeçalho escuro */
.hdr{background:var(--dark);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.hdr.sub{padding:calc(12px + env(safe-area-inset-top)) 16px 14px 6px;gap:6px}
.hdr .tt{display:flex;flex-direction:column;flex:1;min-width:0}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--green);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr h1{margin:2px 0 0;font-size:24px;line-height:1.15;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis}
.hdr.sub h1{font-size:20px;margin:0}
.hdr .back{width:44px;height:44px;border:none;background:none;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;border-radius:12px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--dark2);color:#CFE3A0;white-space:nowrap}
.pill.off{color:#E9D38A}
.avatar{width:40px;height:40px;border-radius:999px;border:none;background:var(--dark2);color:#fff;font-size:14px;font-weight:600;flex:none}
.hbtn{height:40px;padding:0 14px;border-radius:999px;border:none;background:var(--green);color:var(--navy);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}

.main{flex:1;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.main:has(.rodape){padding-bottom:calc(var(--nav-h) + 108px + env(safe-area-inset-bottom))}
.sec{font-size:14px;font-weight:700;padding:6px 4px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec .t2{font-weight:500}
.card{background:var(--card);border-radius:18px;overflow:hidden}
.card.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.card.big{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.sel{box-shadow:0 0 0 2px var(--navy)}
button.card,a.card{border:none;text-align:left;width:100%;color:inherit;text-decoration:none;display:block}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);background:none;width:100%;border-left:none;border-right:none;border-top:none;text-align:left;color:inherit}
.row:last-child{border-bottom:none}
button.row{min-height:60px}
.grow{flex:1;min-width:0}
.t1{font-weight:600;font-size:15px;line-height:1.3}
.t2{font-size:13px;color:var(--muted);line-height:1.35}
.t3{font-size:11px;color:var(--muted)}
.chev{color:var(--hint);font-size:20px;flex:none}
.dot{width:10px;height:10px;border-radius:999px;flex:none;display:inline-block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.num4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.num4 > span{display:flex;flex-direction:column;min-width:0}
.num4 b{font-size:16px;font-weight:700}
.num4 .t3{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sw{width:7px;height:7px;border-radius:2px;flex:none}
.kpi{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.15}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft)}
.bar.thin{height:8px}
.bar > div{height:100%}

/* botões */
.btn{min-height:56px;border-radius:16px;border:none;background:var(--green);color:var(--navy);font-size:17px;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.dark{background:var(--navy);color:#fff}
.btn.soft{background:var(--bg);color:var(--navy);font-weight:600;font-size:15px}
.btn.white{background:#fff;color:var(--navy);font-weight:600;font-size:15px}
.btn.danger{background:var(--mag-bg);color:var(--mag-t);font-weight:600;font-size:15px}
.btn.sm{min-height:48px;border-radius:14px;font-size:15px;padding:0 14px}
.btn.xs{min-height:40px;border-radius:999px;font-size:13px;padding:0 12px;font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:72px;border-radius:18px;justify-content:flex-start;gap:14px;text-align:left;padding:0 18px}
.btn.big .ico{width:40px;height:40px;border-radius:12px;background:var(--navy);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.link{border:none;background:none;font-size:14px;font-weight:600;color:var(--green-t);padding:8px;text-decoration:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}

/* campos */
label.f{display:flex;flex-direction:column;gap:6px}
label.f > span.lb{font-size:14px;font-weight:600}
.inp{height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 16px;width:100%}
.inp:focus{outline:3px solid var(--green);outline-offset:0;border-color:var(--navy)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 15px) 23px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.inp{height:auto;min-height:88px;padding:12px 16px;line-height:1.45}
.search{height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.search input{border:none;outline:none;flex:1;min-width:0;height:100%;background:none;font-size:15px}

/* passo a passo de quantidade */
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:48px;height:48px;border-radius:14px;border:none;background:var(--bg);font-size:24px;line-height:1}
.stepper input{width:58px;height:48px;text-align:center;font-weight:700;font-size:22px;border:none;background:none;padding:0}
.stepper input:focus{outline:2px solid var(--green);border-radius:10px}

/* etiquetas */
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.y{background:var(--y-bg);color:var(--y-t)} .tag.ok{background:var(--ok-bg);color:var(--ok-t)} .tag.b{background:var(--blue-bg);color:var(--blue-t)}
.tag.m{background:var(--mag-bg);color:var(--mag-t)} .tag.g{background:var(--soft);color:var(--navy)} .tag.o{background:var(--orange-bg);color:var(--orange-t)} .tag.gr{background:var(--green-bg);color:var(--green-t)}
.tag.sq{border-radius:8px;padding:3px 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.note{border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;line-height:1.4}
.note.ok{background:var(--ok-bg);color:var(--ok-t)} .note.m{background:var(--mag-bg);color:var(--mag-t)} .note.b{background:var(--blue-bg);color:var(--blue-t)} .note.y{background:var(--y-bg);color:var(--y-t)} .note.o{background:var(--orange-bg);color:var(--orange-t)} .note.gr{background:var(--green-bg);color:var(--green-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:none;background:#fff;font-weight:600;font-size:13px;color:var(--navy)}
.card .chip,.sheet .chip{background:var(--bg)}
.chip.on,.card .chip.on,.sheet .chip.on{background:var(--navy);color:#fff}

/* zonas de envio */
.drop{min-height:128px;border-radius:16px;border:2px dashed #C9CEC2;background:#FAFBF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--navy);padding:12px;width:100%;text-align:center}
.drop.main{border-color:var(--green);background:#F7F9F0}
.drop.over{background:var(--green-bg)}
.drop b{font-size:16px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:none;width:100%;text-align:left;color:inherit}
.file .ext{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);flex:none}

/* navegação inferior */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.bottomnav .in{display:flex;max-width:720px;width:100%;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);pointer-events:auto}
.bottomnav button{flex:1;min-height:var(--nav-h);border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:-.01em;font-weight:600;color:var(--muted);border-top:3px solid transparent;position:relative;min-width:0;padding:0 1px}
.bottomnav button.on{color:var(--navy);border-top-color:var(--green)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--mag);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.rodape{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:25;display:flex;justify-content:center;pointer-events:none}
.rodape .in{max-width:720px;width:100%;background:#fff;border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}

/* folhas (modais) */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(19,21,43,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:24px}}
.sheet .handle{width:40px;height:4px;border-radius:999px;background:var(--line);align-self:center;margin-top:10px;flex:none}
.sheet .sh{padding:10px 12px 6px 22px;display:flex;align-items:center;gap:8px}
.sheet .sh h2{margin:0;font-size:19px;font-weight:700;flex:1}
.sheet .sb{padding:6px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);display:flex;gap:8px}
.sheet .menuitem{width:100%;min-height:56px;border:none;background:none;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;text-align:left;padding:0 4px;color:var(--navy)}
.sheet .menuitem:last-child{border-bottom:none}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.photo{background:var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;font-size:12px;font-weight:600;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line2);background:#FAFBF8}
table.tb td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tb td input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:14px}
.scrollx{overflow-x:auto}
.plan{position:relative;background:#fff;overflow:auto;max-height:62vh;touch-action:pan-x pan-y}
.plan .inner{position:relative}
.plan img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.pt{position:absolute;transform:translate(-50%,-50%);border-radius:999px;padding:0;box-shadow:0 0 0 2px #fff}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;padding:0 4px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:999px;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.dias7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dias7 > span{display:flex;flex-direction:column;align-items:center;gap:4px}
.dias7 .q{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

/* entrar */
.login{min-height:100vh;background:var(--dark);display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.login .top{padding:calc(64px + env(safe-area-inset-top)) 28px 40px;display:flex;flex-direction:column;gap:18px}
.login .tile{width:56px;height:56px;border-radius:16px;background:var(--green);display:flex;align-items:center;justify-content:center}
.login h1{margin:0;font-size:34px;font-weight:700;line-height:1.1;color:#fff}
.login .panel{flex:1;background:var(--bg);border-radius:28px 28px 0 0;padding:32px 24px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.login .logo{width:132px;height:auto;align-self:center;opacity:.9;mix-blend-mode:multiply}
@media (min-width:560px){.login{min-height:auto;margin:40px auto;border-radius:28px;overflow:hidden}.login .panel{border-radius:28px}}
.seg{display:flex;background:#E6EAE0;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:50px;border:none;border-radius:11px;background:transparent;font-size:12px;font-weight:600;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;font-family:inherit}
.seg button b{font-size:16px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.leitor{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.leitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leitor .moldura{position:absolute;left:50%;top:45%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #AEC155;border-radius:24px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.leitor .lt-topo{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;color:#fff;font-size:17px}
.leitor .lt-x{width:44px;height:44px;border-radius:999px;border:none;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.leitor .lt-msg{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:600;font-size:15px;background:rgba(0,0,0,.55);border-radius:14px;padding:12px}
.leitor .lt-msg.erro{background:rgba(122,21,86,.85)}
.leitor .lt-dig{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom))}
.reqs{list-style:none;padding:0;margin:0}
.reqs li{font-size:13px;color:var(--muted);padding:4px 0 4px 24px;position:relative}
.reqs li::before{content:'○';position:absolute;left:0;top:4px;font-size:13px;color:#B9BFB2}
.reqs li.ok{color:var(--green-t);font-weight:600}
.reqs li.ok::before{content:'✓';color:var(--green-t);font-weight:800}
.login h2{margin:0;font-size:20px;font-weight:700;color:var(--navy)}

/* ===== computador (tela larga): menu lateral e conteúdo largo ===== */
.side{display:none}
.dcols,.dcol,.dgrid{display:contents}
.kanban{display:none}
@media (min-width:1024px){
  :root{--nav-h:0px}
  .app{max-width:none;margin:0;padding-left:248px;box-shadow:none}
  .bottomnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--dark);padding:22px 16px;z-index:40;box-sizing:border-box}
  .side .marca{display:flex;align-items:center;gap:10px;padding:0 6px 22px}
  .side .marca .lg{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
  .side .marca .lg img{width:34px;height:auto}
  .side .marca b{color:#fff;font-size:15px;display:block}
  .side .marca .eyebrow{font-size:10px}
  .side .nv{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:12px;border:none;background:none;font-size:14px;font-weight:600;color:#B9C2BD;position:relative;text-align:left;font-family:inherit;cursor:pointer}
  .side .nv:hover{background:#26302F;color:#fff}
  .side .nv.on{background:#2F3B3A;color:#fff}
  .side .nv.on::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--green)}
  .side .nv .t{flex:1}
  .side .nv .bd{min-width:20px;height:20px;border-radius:999px;background:#A3236B;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .side .eu{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #2F3B3A;border-left:none;border-right:none;border-bottom:none;background:none;text-align:left;font-family:inherit;cursor:pointer}
  .side .eu .av{width:36px;height:36px;border-radius:999px;background:#2F3B3A;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .side .eu span{font-size:13px;color:#fff;line-height:1.3;min-width:0}
  .side .eu small{color:#B9C2BD;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr{background:#F7F8F4;color:var(--navy);border-bottom:1px solid var(--line);padding:20px 36px 18px}
  .hdr.sub{padding:14px 36px 14px 24px}
  .hdr h1{color:var(--navy)}
  .hdr .eyebrow{color:#6F7A2E}
  .hdr .back{color:var(--navy)}
  .hdr .avatar{display:none}
  .main{width:100%;max-width:1240px;margin:0 auto;box-sizing:border-box;padding:24px 36px 48px}
  .main:has(.rodape){padding-bottom:120px}
  .hdr.sub+.main{max-width:860px}
  .rodape{left:248px;bottom:0}
  .rodape .in{max-width:860px;border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0}
  .toast{left:calc(50% + 124px);bottom:28px}
  .dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .dcols.l{grid-template-columns:minmax(340px,.8fr) minmax(0,1.2fr)}
  .dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;align-items:start}
  .seg.desk-off{display:none}
  .kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
  .kanban .kcol{background:#E9ECE3;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .kanban .kh{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-size:14px;font-weight:700}
  .kanban .kh .n{margin-left:auto;font-size:12px;background:#fff;border-radius:999px;padding:2px 9px}
  .kanban .card.pad{padding:14px;gap:8px}
  .so-cel{display:none}
}
</style>

/* ======= controle por NOTA FISCAL =======

/* ======= recebimento de remessa (pedido, transferência, devolução) ======= */
function receberRemessa(rem, recebidos, usuario) {

    const rec = Number(recebidos[it.key] != null ? recebidos[it.key] : enviado) || 0;
    const ok = Math.min(rec, enviado);
    // divide o que está em trânsito por nota: primeiro o que chegou, o resto vira pendência
    const trans = movFIFO('x', it.key, enviado, 'TR:' + rem.id, null, rem.id, usuario.nome).map(o => ({ nf: o.doc.nf, q: o.doc.qtd }));

    trans.forEach(t => { const q = Math.min(okResta, t.q); if (q > 0) ops.push(movimento('recebimento', it.key, q, 'TR:' + rem.id, destino, rem.id, usuario.nome, { nf: t.nf })); okResta -= q; if (t.q - q > 0) faltaNF.push({ nf: t.nf, q: t.q - q }); });

      ops.push({ c: 'pendencias', doc: p });

    }

}

  // tira do lugar de origem e coloca em trânsito
  const origem = rem.origem === 'CD' ? 'CD' : 'F:' + rem.origem;
  const ops = [];
  rem.itens.forEach(it => { const q = it.enviado != null ? it.enviado : it.qtd; if (q > 0) movFIFO('saida', it.key, q, origem, 'TR:' + rem.id, rem.id, usuario.nome).forEach(o => ops.push(o)); });

/* ================= LEITURA DA NOTA (PDF / imagem) ================= */
async function lerTextoPDF(file, aoProgresso) {
  await loadScript(LIBS.pdfjs);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfworker;
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let texto = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const linhas = {};
    tc.items.forEach(it => { const y = Math.round(it.transform[5] / 3); (linhas[y] = linhas[y] || []).push(it); });
    Object.keys(linhas).sort((a, b) => b - a).forEach(y => { texto += linhas[y].sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ') + '\n'; });
  }
  if (texto.replace(/\s/g, '').length > 300) return { texto, metodo: 'texto do PDF' };
  // PDF escaneado: reconhecimento de texto no próprio aparelho
  await loadScript(LIBS.tesseract);
  aoProgresso && aoProgresso('Preparando leitura da imagem (1ª vez baixa o idioma)…');
  const worker = await window.Tesseract.createWorker('por', 1, { logger: m => { if (m.status === 'recognizing text' && aoProgresso) aoProgresso('Lendo a nota… ' + Math.round(m.progress * 100) + '%'); } });
  await worker.setParameters({ tessedit_pageseg_mode: '6' });
  texto = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    aoProgresso && aoProgresso('Lendo página ' + p + ' de ' + pdf.numPages + '…');
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 3 });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const r = await worker.recognize(c);
    texto += '\n=====PAGINA ' + p + '=====\n' + r.data.text;
  }
  await worker.terminate();
  return { texto, metodo: 'leitura da imagem (OCR)' };
}
async function lerTextoImagem(file, aoProgresso) {
  await loadScript(LIBS.tesseract);
  const worker = await window.Tesseract.createWorker('por', 1, { logger: m => { if (m.status === 'recognizing text' && aoProgresso) aoProgresso('Lendo a foto… ' + Math.round(m.progress * 100) + '%'); } });

    const notasLote = L.notas.map(id => store.pegar('notas', id)).filter(n => n && n.local);
    const locaisLote = [...new Set(notasLote.map(n => n.local))];
    const ops = [];
    // notas da mesma leva sem local escrito (ex.: 3 notas no mesmo PDF) ficam com o local das outras
    if (locaisLote.length === 1) L.notas.map(id => store.pegar('notas', id)).filter(n => n && !n.local && n.status === 'rascunho').forEach(n => {
      const d = Object.assign({}, n, { local: locaisLote[0] });
      if (validarNota(d).pronta) Object.assign(d, { status: 'liberada', liberadaEm: agoraISO(), liberadaPor: u.nome });
      ops.push({ c: 'notas', doc: d });
    });
    store.todos('projetos').filter(p => !p.local).forEach(p => {
      const porPJ = p.numero && store.todos('notas').find(n => (n.projetosRef || []).includes(p.numero) && n.local);
      const loc = porPJ ? porPJ.local : (L.projs.includes(p.id) && locaisLote.length === 1 ? locaisLote[0] : '');
      if (loc) ops.push({ c: 'projetos', doc: Object.assign({}, p, { local: loc }) });
    });
    if (ops.length) {
      store.gravarVarios(ops);
      const ids = new Set(ops.map(o => o.doc.id));
      setArqs(a => a.map(x => x.notas && x.notas.some(i => ids.has(i)) ? Object.assign({}, x, { msg: x.msg.replace(/ · \d+ para revisar/, '') + ' · local: ' + locaisLote[0] }) : x.projs && x.projs.some(i => ids.has(i)) ? Object.assign({}, x, { semLocal: false, msg: x.msg.replace(/ · toque.*$/, '') + ' · ' + ops.find(o => x.projs.includes(o.doc.id)).doc.local + ' (da nota)' }) : x));
    }
  };
  const manual = () => { const d = { id: uid('nf'), numero: '', fornecedor: 'Mills', contrato: '', local: '', itens: [], status: 'rascunho', contagem: {}, criadoEm: agoraISO(), criadoPor: u.nome, metodo: 'manual', qtdNota: 0, totalNota: 0 }; store.gravar('notas', d); ir('receb', 'revisar', { id: d.id }); };
  const abrirNota = (n) => ir('receb', n.status === 'rascunho' ? (podeNotas ? 'revisar' : 'nota') : n.status === 'concluida' ? 'nota' : (podeNotas ? 'conferir' : 'nota'), { id: n.id });
  const tocarArquivo = (a) => {
    if (a.st === 'erro' && a.tipo !== 'projeto') return podeNotas && manual();
    if (a.notas && a.notas[0]) { const n = store.pegar('notas', a.notas[0]); if (n) abrirNota(n); return; }
    if (a.projs) { if (a.semLocal && !(store.pegar('projetos', a.projs[0]) || {}).local) return setLocProj(a); ir('cd', 'projeto', { id: a.projs[0] }); }
  };

  const [q, setQ] = useState('');
  const notas = store.todos('notas').map(n => Object.assign({ sit: situacaoNota(n) }, n));
  const abertas = notas.filter(n => n.sit.aberta).sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''));
  const F = { falta: n => n.sit.falta, sobra: n => n.sit.sobra, ok: n => n.sit.ok };
  const tot = notas.filter(n => n.status === 'concluida').reduce((o, n) => { const v = valoresNota(n); o.fv += v.fv; o.sq += v.sq; return o; }, { fv: 0, sq: 0 });
  const quadro = [['falta', 'Com falta', tot.fv ? brl(tot.fv).replace(/,00$/, '') + ' em risco' : 'nada em risco'], ['sobra', 'Com sobra', tot.sq ? plural(tot.sq, 'peça') + ' a mais' : 'nenhuma sobra'], ['ok', 'Tudo certo', 'sem diferença']];
  const filtradas = filtro !== 'todas' && F[filtro] ? notas.filter(F[filtro]).sort((a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || '')) : null;
  // empresas
  const grupos = {}; notas.forEach(n => { const g = grupoEmpresa(n.fornecedor); (grupos[g] = grupos[g] || []).push(n); });
  const empresas = Object.keys(grupos).map(g => ({ g, ns: grupos[g], ab: grupos[g].filter(n => n.sit.aberta).length })).sort((a, b) => (b.ab - a.ab) || b.ns.length - a.ns.length || a.g.localeCompare(b.g));
  // busca
  const achadas = q.trim() ? notas.filter(n => bate(q, 'NF ' + n.numero + ' ' + n.numero + ' ' + n.fornecedor + ' ' + grupoEmpresa(n.fornecedor) + ' ' + (n.local || ''))).sort((a, b) => (b.sit.aberta - a.sit.aberta)) : null;
  const lista = (ns, semEmp) => html`<div className="card">${ns.map(n => html`<${LinhaNotaReceb} key=${n.id} n=${n} semEmpresa=${semEmp} aoAbrir=${() => abrirNota(n)} />`)}</div>`;
  const cartaoAberta = (n) => {
    const it = (n.itens || []).length, conf = Object.keys(n.contagem || {}).length, qp = (n.itens || []).reduce((t, i) => t + (Number(i.qtd) || 0), 0);
    const rev = n.status === 'rascunho'; const parcial = (n.viagens || []).length > 0;
    const prog = parcial ? (qp ? pecasRecebidas(n) / qp * 100 : 0) : (it ? conf / it * 100 : 0);
    return html`<div key=${n.id} className="card pad" style=${{ gap: 10, padding: '14px 16px' }}>
      <div style=${{ display: 'flex', alignItems: 'center', gap: 12 }}><${TileEmpresa} nome=${n.fornecedor} />
        <span className="grow"><div style=${{ fontSize: 16, fontWeight: 700 }}>NF ${n.numero || '(sem número)'} · ${grupoEmpresa(n.fornecedor)}</div><div className="t2">${n.local || 'sem local'} · ${nfmt(qp)} pç</div></span>
        <${EtiquetaSit} k="conferir" t=${rev ? 'Revisar leitura' : parcial ? 'Parcial' : 'A conferir'} /></div>
      <div style=${{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <span className="grow" style=${{ display: 'flex', flexDirection: 'column', gap: 4 }}><span className="bar thin" style=${{ height: 6 }}><div style=${{ width: prog + '%', background: 'var(--navy)' }}></div></span><span className="t3">${linhaInfoNota(n)}</span></span>
        <button className="btn dark xs" style=${{ borderRadius: 12, minHeight: 40, padding: '0 16px', fontSize: 13, fontWeight: 700 }} onClick=${() => abrirNota(n)}>${rev ? 'Revisar' : parcial ? 'Nova viagem' : conf ? 'Continuar' : 'Conferir'}</button></div>
    </div>`;
  };

  return html`<${Tela} ctx=${ctx} eyebrow="Quem busca na fábrica" titulo="Coleta" direita=${podeNotas && html`<button className="hbtn" disabled=${ocupado} aria-label="Subir notas e projetos" onClick=${() => ref.current.click()}>${ocupado ? html`<span className="spin" style=${{ width: 16, height: 16, borderWidth: 2 }}></span>` : html`<${Ic} n="plus" s=${16} w=${2.6} />`}Subir</button>`}>
    ${podeNotas && html`<input ref=${ref} type="file" multiple accept=".pdf,.dwg,.dxf,application/pdf,image/*" style=${{ display: 'none' }} onChange=${(e) => { subir(e.target.files); e.target.value = ''; }} />`}
    ${store.modo === 'demo' && html`<div className="note y">Modo demonstração: dados de exemplo, só neste aparelho.</div>`}
    <label className="search"><${Ic} n="search" s=${20} /><input placeholder="Número da NF ou empresa" inputmode="search" value=${q} onChange=${(e) => setQ(e.target.value)} aria-label="Buscar nota" />${q && html`<button className="iconbtn" aria-label="Limpar busca" onClick=${() => setQ('')}><${Ic} n="x" s=${18} /></button>`}</label>
    ${arqs.length > 0 && html`<div className="card pad" style=${{ gap: 8, padding: 12 }}>
      ${arqs.map(a => html`<button key=${a.id} className="file" onClick=${() => tocarArquivo(a)}>
        <span className="ext">${a.ext}</span>
        <span className="grow" style=${{ fontSize: 13, minWidth: 0 }}><b style=${{ wordBreak: 'break-all' }}>${a.nome}</b><br/><span className="t2">${a.msg}${a.semLocal ? ' · toque para escolher o local' : ''}</span></span>
        ${a.st === 'lendo' && html`<span className="spin"></span>`}${a.st === 'ok' && html`<b style=${{ color: a.semLocal || /revisar/.test(a.msg) ? SIT_COR.conferir : SIT_COR.ok }}>${a.semLocal || /revisar/.test(a.msg) ? '!' : '✓'}</b>`}${a.st === 'erro' && html`<b style=${{ color: SIT_COR.falta }}>!</b>`}</button>`)}
      ${!ocupado && html`<button className="link" style=${{ alignSelf: 'flex-end', color: 'var(--muted)', padding: 4 }} onClick=${() => setArqs([])}>Limpar lista</button>`}
    </div>`}
    ${achadas ? html`<div className="sec">Resultado da busca<span className="t2">${plural(achadas.length, 'nota')}</span></div>
      ${achadas.length ? lista(achadas) : html`<div className="card"><${Vazio}>Nenhuma nota com "${q}".</${Vazio}></div>`}` : html`
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3,minmax(0,1fr))', gap: 8 }}>${quadro.map(([k, l, sub]) => { const sel = filtro === k;
      return html`<button key=${k} className="card" aria-pressed=${sel} style=${{ padding: 12, display: 'flex', flexDirection: 'column', gap: 2, borderRadius: 16, boxShadow: sel ? '0 0 0 2px var(--navy)' : 'none' }} onClick=${() => setF(sel ? 'todas' : k)}>
        <span style=${{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 600, color: 'var(--muted)' }}><span className="dot" style=${{ width: 8, height: 8, background: SIT_COR[k] }}></span>${l}</span>
        <span style=${{ fontSize: 26, fontWeight: 700, lineHeight: 1.15 }}>${notas.filter(F[k]).length}</span><span className="t3">${sub}</span></button>`; })}</div>
    ${filtradas && html`<div className="sec">${{ falta: 'Notas com falta', sobra: 'Notas com sobra', ok: 'Notas sem diferença' }[filtro]}<button className="link" style=${{ padding: 0 }} onClick=${() => setF('todas')}>Fechar ✕</button></div>
      ${filtradas.length ? lista(filtradas) : html`<div className="card"><${Vazio}>Nenhuma nota aqui.</${Vazio}></div>`}`}
    <div className="dcols l"><div className="dcol">
    ${abertas.map(n => html`<${AvisoProjetoNota} key=${'pj' + n.id} nota=${n} />`)}
    <div className="sec">Para conferir agora<span className="t2">${plural(abertas.length, 'nota')}</span></div>
    ${abertas.length ? abertas.map(cartaoAberta) : html`<div className="card"><${Vazio}>Nenhuma nota esperando conferência.${podeNotas ? ' Toque em "Subir" para mandar as notas que chegaram.' : ''}</${Vazio}></div>`}
    </div><div className="dcol">
    <div className="sec">Empresas<span className="t2">${plural(empresas.length, 'empresa')}</span></div>
    ${empresas.length ? html`<div className="card">${empresas.map(e => {
      const pc = e.ns.reduce((t, n) => t + (n.itens || []).reduce((a, i) => a + (Number(i.qtd) || 0), 0), 0);
      const marcas = [['conferir', e.ab], ['falta', e.ns.filter(F.falta).length], ['sobra', e.ns.filter(F.sobra).length]].filter(x => x[1]);
      return html`<button key=${e.g} className="row" style=${{ padding: '12px 16px' }} onClick=${() => ir('receb', 'empresa', { emp: e.g })}>
        <${TileEmpresa} nome=${e.g} /><span className="grow"><div style=${{ fontSize: 15, fontWeight: 700 }}>${e.g}</div><div className="t2">${plural(e.ns.length, 'nota')} · ${nfmt(pc)} pç</div></span>
        <span style=${{ display: 'flex', gap: 4, flex: 'none' }}>${(marcas.length ? marcas : [['ok', '✓']]).map(([k, n]) => html`<span key=${k} style=${{ height: 24, padding: '0 8px', borderRadius: 999, background: 'var(--bg)', fontSize: 12, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 5 }}><span className="dot" style=${{ width: 7, height: 7, background: SIT_COR[k] }}></span>${n}</span>`)}</span>
        <span className="chev">›</span></button>`; })}</div>
      <div style=${{ display: 'flex', gap: 14, flexWrap: 'wrap', padding: '0 4px' }} className="t3">${[['conferir', 'a conferir'], ['falta', 'com falta'], ['sobra', 'com sobra'], ['ok', 'tudo certo']].map(([k, l]) => html`<span key=${k} style=${{ display: 'flex', alignItems: 'center', gap: 5 }}><span className="dot" style=${{ width: 9, height: 9, background: SIT_COR[k] }}></span>${l}</span>`)}</div>`
      : html`<div className="card"><${Vazio}>Nenhuma nota ainda.</${Vazio}></div>`}</div></div>`}
    ${podeNotas && html`<button className="link" style=${{ alignSelf: 'center' }} onClick=${manual}>Cadastrar nota à mão</button>`}
    ${locProj && html`<${DefinirLocal} titulo="Local do projeto" texto="O app não achou o local no projeto nem uma nota ligada a ele. Digite o local ou escolha um que já existe." lido=${(store.pegar('projetos', locProj.projs[0]) || {}).localLido} aoFechar=${() => setLocProj(null)} aoSalvar=${(l) => { store.gravarVarios(locProj.projs.map(id => ({ c: 'projetos', doc: Object.assign({}, store.pegar('projetos', id), { local: l }) }))); upd(locProj.id, { semLocal: false, msg: locProj.msg + ' · ' + l }); setLocProj(null); toast('Local salvo.'); }} />`}
  </${Tela}>`;
}

// Tela de uma empresa: resumo e notas separadas por situação
function TelaEmpresa({ ctx }) {
  const { usuario: u, ir, nav } = ctx; useStore();
  const g = nav.p.emp; const podeNotas = pode(u, 'notas');
  const notas = store.todos('notas').filter(n => grupoEmpresa(n.fornecedor) === g).map(n => Object.assign({ sit: situacaoNota(n) }, n));
  const S = { conferir: n => n.sit.aberta, falta: n => n.sit.falta, sobra: n => n.sit.sobra, ok: n => n.sit.ok };
  const [seg, setSeg] = useState(() => ['conferir', 'falta', 'sobra', 'ok'].find(k => notas.some(S[k])) || 'conferir');
  const pecas = notas.reduce((t, n) => t + pecasRecebidas(n), 0);
  const fv = notas.filter(n => n.status === 'concluida').reduce((t, n) => t + valoresNota(n).fv, 0);
  const lista = notas.filter(S[seg]).sort((a, b) => (b.concluidaEm || b.criadoEm || '').localeCompare(a.concluidaEm || a.criadoEm || ''));
  const abrir = (n) => ir('receb', n.status === 'rascunho' ? (podeNotas ? 'revisar' : 'nota') : n.status === 'concluida' ? 'nota' : (podeNotas ? 'conferir' : 'nota'), { id: n.id });

    <main className="main">
      <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3,minmax(0,1fr))', gap: 8 }}>
        <div className="kpi" style=${{ borderRadius: 16, padding: 12 }}><span className="v" style=${{ fontSize: 20 }}>${notas.length}</span><span className="l">notas</span></div>
        <div className="kpi" style=${{ borderRadius: 16, padding: 12 }}><span className="v" style=${{ fontSize: 20 }}>${nfmt(pecas)}</span><span className="l">peças recebidas</span></div>
        <div className="kpi" style=${{ borderRadius: 16, padding: 12 }}><span className="v" style=${{ fontSize: 20 }}>${fv ? brl(fv).replace(/,00$/, '') : '—'}</span><span className="l">em falta</span></div></div>
      <div style=${{ display: 'flex', background: 'var(--soft)', borderRadius: 14, padding: 4, gap: 4 }}>${[['conferir', 'A conferir'], ['falta', 'Falta'], ['sobra', 'Sobra'], ['ok', 'Certas']].map(([k, l]) => { const sel = seg === k;
        return html`<button key=${k} aria-pressed=${sel} onClick=${() => setSeg(k)} style=${{ flex: 1, minHeight: 46, borderRadius: 11, border: 'none', fontSize: 12, fontWeight: 600, background: sel ? '#fff' : 'transparent', boxShadow: sel ? '0 1px 3px rgba(0,0,0,.12)' : 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', lineHeight: 1.25 }}>
          <span style=${{ display: 'flex', alignItems: 'center', gap: 4 }}><span className="dot" style=${{ width: 7, height: 7, background: SIT_COR[k] }}></span>${notas.filter(S[k]).length}</span><span>${l}</span></button>`; })}</div>
      ${lista.length ? lista.map(n => { const it = (n.itens || []).length, conf = Object.keys(n.contagem || {}).length, qp = (n.itens || []).reduce((t, i) => t + (Number(i.qtd) || 0), 0); const k = chaveSit(n);
        return html`<div key=${n.id} className="card pad" style=${{ gap: 10 }}>

            <${EtiquetaSit} k=${k} t=${n.status === 'rascunho' ? 'Revisar leitura' : (n.viagens || []).length && n.status !== 'concluida' ? 'Parcial' : { conferir: 'A conferir', falta: 'Com falta', sobra: 'Com sobra', ok: 'Tudo certo' }[k]} /></div>

}

function RevisarNota({ ctx }) {
  const { usuario: u, ir, nav } = ctx;
  const nota = store.pegar('notas', nav.p.id);
  const [n, setN] = useState(() => nota ? JSON.parse(JSON.stringify(nota)) : null);
  if (!n) return html`<${Tela} ctx=${ctx} titulo="Nota" voltar=${() => ir('receb')}><${Vazio}>Nota não encontrada.</${Vazio}></${Tela}>`;
  const set = (k, v) => setN(Object.assign({}, n, { [k]: v }));
  const setItem = (i, k, v) => { const its = n.itens.slice(); its[i] = Object.assign({}, its[i], { [k]: v, duvida: false }); setN(Object.assign({}, n, { itens: its })); };
  const nDuvida = n.itens.filter(i => i.duvida).length;
  const v = validarNota(n);
  const semFoto = n.itens.filter(i => !(store.pegar('catalogo', itemKey(n.fornecedor, i.codigo)) || {}).foto).length;
  const salvar = (liberar) => {
    const itens = n.itens.filter(i => i.codigo).map(i => Object.assign({}, i, { key: itemKey(n.fornecedor, i.codigo), qtd: Number(i.qtd) || 0, vu: parseNumBR(i.vu) }, liberar ? { duvida: false } : {}));
    const ops = [];
    itens.forEach(i => { const c = store.pegar('catalogo', i.key); if (!c) ops.push({ c: 'catalogo', doc: { id: i.key, fornecedor: n.fornecedor, codigo: i.codigo, desc: i.desc, vu: i.vu, baia: '', rotulo: '', foto: null } }); else if (!c.vu && i.vu) ops.push({ c: 'catalogo', doc: Object.assign({}, c, { vu: i.vu }) }); });
    const doc = Object.assign({}, n, { itens, local: (n.local || '').replace(/\s+/g, ' ').trim(), qtdNota: Number(n.qtdNota) || 0, totalNota: parseNumBR(n.totalNota) });
    if (doc.local) registrarLocal(doc.local, n.localLido);
    if (liberar) { doc.status = 'liberada'; doc.liberadaEm = agoraISO(); doc.liberadaPor = u.nome; }
    ops.push({ c: 'notas', doc }); store.gravarVarios(ops);
    toast(liberar ? 'Nota pronta para conferência.' : 'Alterações salvas.');
    ir('receb', liberar ? 'conferir' : '', liberar ? { id: doc.id } : {});
  };
  const podeLiberar = n.numero && n.local && n.itens.length > 0;
  const linhaChk = (ok, t1, t2, campo) => html`<div className="row"><span className="dot" style=${{ background: ok === null ? 'var(--y)' : ok ? 'var(--ok)' : 'var(--mag)' }}></span><div className="grow"><div className="t1">${t1}</div><div className="t2">${t2}</div></div>${campo}</div>`;
  return html`<${Tela} ctx=${ctx} eyebrow=${'Revisar leitura · ' + (n.metodo || '')} titulo=${'NF ' + (n.numero || '(sem número)')} voltar=${() => ir('receb')}>
    <div className="card pad">
      <div className="grid2">
        <label className="f"><span className="lb">Nº da nota</span><input className="inp" value=${n.numero} onChange=${(e) => set('numero', e.target.value.replace(/\D/g, ''))} /></label>
        <label className="f"><span className="lb">Fornecedor</span><select className="inp" value=${n.fornecedor} onChange=${(e) => set('fornecedor', e.target.value)}>${[...new Set((config().fornecedores || FORNECEDORES_PADRAO).concat([n.fornecedor || 'Outra']))].map(f => html`<option key=${f}>${f}</option>`)}</select></label>
      </div>
      <label className="f"><span className="lb">Local da aplicação</span><${CampoLocal} valor=${n.local} set=${(x) => set('local', x)} lido=${n.localLido} /></label>
      <div className="grid2">
        <label className="f"><span className="lb">Contrato</span><input className="inp" value=${n.contrato || ''} onChange=${(e) => set('contrato', e.target.value)} /></label>
        <label className="f"><span className="lb">Emissão</span><input className="inp" value=${n.emissao || ''} onChange=${(e) => set('emissao', e.target.value)} placeholder="dd/mm/aaaa" /></label>
      </div>
    </div>

    <div style=${{ position: 'relative', borderRadius: 14, border: '1px dashed #B9BFB2', background: '#FAFBF8', height: h || 150 }}>
      <canvas ref=${ref} aria-label=${'Assinatura: ' + rotulo} style=${{ width: '100%', height: '100%', touchAction: 'none', display: 'block', borderRadius: 14 }} onPointerDown=${ini} onPointerMove=${mov} onPointerUp=${fim} onPointerCancel=${fim} onPointerLeave=${fim}></canvas>

function EnviarDaFrente({ ctx, local, tipo, inicial, hojeRems, aoFechar }) {
  const { usuario: u } = ctx; const res = resumoFrente(local);
  const [dest, setDest] = useState(''); const [qt, setQt] = useState(() => { const o = {}; if (inicial) { const r = res.find(x => x.key === inicial); if (r) o[inicial] = r.aguardando; } return o; });
  const soltas = {}; res.forEach(r => soltas[r.key] = r.aguardando);
  const preencherHoje = () => { const o = {}; (hojeRems || []).forEach(r => r.itens.forEach(i => { o[i.key] = Math.min(soltas[i.key] || 0, (o[i.key] || 0) + (i.recebido || 0)); })); setQt(o); };
  const enviar = () => {
    const itens = Object.keys(qt).filter(k => Number(qt[k]) > 0).map(k => ({ key: k, qtd: Number(qt[k]), enviado: Number(qt[k]) }));
    if (!itens.length) return toast('Informe as quantidades.');
    const destino = tipo === 'devolucao' ? 'CD' : dest; if (!destino) return toast('Escolha a frente de destino.'); if (tipo !== 'devolucao') registrarLocal(destino);
    const rem = { id: uid('rm'), numero: proximoNumero(tipo === 'devolucao' ? 'DV' : 'TF'), tipo, origem: local, destino, dataUso: hoje(), itens, status: 'solicitado', solicitante: u.nome, criadoEm: agoraISO(), historico: [{ st: 'solicitado', em: agoraISO(), por: u.nome }] };
    despacharRemessa(rem, u, 'em_transito');
    toast(tipo === 'devolucao' ? 'Devolução enviada. O CD confirma ao receber.' : 'Transferência enviada. ' + destino + ' confirma ao receber.'); aoFechar();
  };
  return html`<${Sheet} titulo=${tipo === 'devolucao' ? 'Devolver ao CD' : 'Transferir para outra frente'} aoFechar=${aoFechar} rodape=${html`<button className="btn block" onClick=${enviar}>${tipo === 'devolucao' ? 'Enviar devolução' : 'Enviar transferência'}</button>`}>
    ${tipo === 'transferencia' && html`<div className="f"><span className="lb">Para qual frente</span><${CampoLocal} valor=${dest} set=${setDest} excluir=${local} /></div>`}
    ${tipo === 'devolucao' && hojeRems && hojeRems.length > 0 && html`<button className="btn soft sm" onClick=${preencherHoje}>Preencher com o que chegou hoje (vai e volta)</button>`}
    <div>${res.filter(r => r.aguardando > 0).map(r => html`<div key=${r.key} className="row" style=${{ padding: '12px 0' }}><div className="grow"><div className="t1">${r.desc}</div><div className="t2">${r.aguardando} na frente</div></div><${Stepper} valor=${qt[r.key] || 0} max=${r.aguardando} set=${(v) => setQt(Object.assign({}, qt, { [r.key]: Math.min(Number(v) || 0, r.aguardando) }))} /></div>`)}</div>
  </${Sheet}>`;
}

function ContagemDia({ ctx }) {
  const { usuario: u, ir, nav } = ctx; const local = nav.p.local;
  const res = resumoFrente(local); const H = hoje();
  const [cont, setCont] = useState(() => { const o = {}; res.forEach(r => o[r.key] = r.total); return o; });
  const podeF = pode(u, 'frente', local);
  const linhas = res.map(r => { const contadas = Number(cont[r.key]) || 0; return Object.assign({}, r, { contadas, d: contadas - r.total }); });
  const salvar = () => {
    const ops = []; const itens = [];
    linhas.forEach(l => {
      if (l.d < 0) {
        const p = { id: uid('pd'), tipo: 'falta', origem: 'Contagem ' + fmtData(H), ref: null, local, key: l.key, qtd: -l.d, valor: -l.d * l.vu, status: 'aberta', criadoEm: agoraISO(), criadoPor: u.nome, obs: 'Esperadas ' + l.total + ', contadas ' + l.contadas };
        ops.push({ c: 'pendencias', doc: p }); movFIFO('divergencia', l.key, -l.d, 'F:' + local, 'PEND:' + p.id, p.id, u.nome).forEach(o => ops.push(o));
      }
      if (l.d > 0) {
        const p = { id: uid('pd'), tipo: 'sobra', origem: 'Contagem ' + fmtData(H), ref: null, local, key: l.key, qtd: l.d, valor: 0, status: 'aberta', criadoEm: agoraISO(), criadoPor: u.nome, obs: 'Esperadas ' + l.total + ', contadas ' + l.contadas };
        ops.push({ c: 'pendencias', doc: p }); ops.push(movimento('sobra', l.key, l.d, 'SOBRA', 'F:' + local, p.id, u.nome, { nf: '' }));
      }
      itens.push({ key: l.key, saldo: l.contadas, esperadas: l.total, contadas: l.contadas, interpretacao: l.d < 0 ? 'falta' : l.d > 0 ? 'sobra' : 'ok' });
    });
    const exist = contagemDoDia(local, H);
    ops.push({ c: 'contagens', doc: { id: exist ? exist.id : uid('ct'), local, data: H, responsavel: u.nome, itens, criadoEm: agoraISO() } });
    store.gravarVarios(ops); toast('Contagem confirmada.'); ir('cd', 'local', { local });
  };
  return html`<${Tela} ctx=${ctx} eyebrow=${local + ' · ' + diaSemana(H) + ' ' + fmtDataCurta(H)} titulo="Contagem do dia" voltar=${() => ir('cd', 'local', { local })}>
    ${linhas.length ? linhas.map(l => html`<div key=${l.key} className="card pad">
      <div style=${{ display: 'flex', alignItems: 'center', gap: 10 }}><span className="grow"><div className="t1">${l.desc}</div><div className="t2">esperadas ${l.total}</div></span><${Stepper} valor=${cont[l.key]} set=${(v) => setCont(Object.assign({}, cont, { [l.key]: v }))} /></div>
      ${l.d !== 0 && html`<div className=${'note ' + (l.d < 0 ? 'm' : 'b')} style=${{ margin: 0 }}>${l.d < 0 ? 'Falta de ' + (-l.d) + ' · ' + brl(-l.d * l.vu) + ' · vira pendência' : 'Sobra de ' + l.d + ' · vira pendência'}</div>`}
    </div>`) : html`<div className="card"><${Vazio}>Nenhuma peça nesta frente.</${Vazio}></div>`}
    ${!podeF && html`<div className="note y">Seu perfil só pode consultar esta contagem.</div>`}
    ${linhas.length > 0 && podeF && html`<${Rodape}><button className="btn block" onClick=${salvar}>Confirmar contagem</button></${Rodape}>`}
  </${Tela}>`;
}

  const [novoPt, setNovoPt] = useState(null); const [ptAberto, setPtAberto] = useState(null); const [baixando, setBaixando] = useState(''); const boxRef = useRef();
  const voltar = () => ir('cd', 'projetos', nav.p.local ? { local: nav.p.local } : {});
  const ptsAll = proj ? proj.pontos || [] : [];
  const pts = ptsAll.filter(p => !sel || p.key === sel);
  useEffect(() => { const b = boxRef.current; if (!b || zoom === 1 || !pts[0] || !proj) return; const W = b.clientWidth * zoom, Hh = W * proj.h / proj.w; b.scrollLeft = pts[0].x * W - b.clientWidth / 2; b.scrollTop = pts[0].y * Hh - b.clientHeight / 2; }, [zoom, sel]);
  if (!proj) return html`<${Tela} ctx=${ctx} titulo="Projeto" voltar=${voltar}><${Vazio}>Projeto não encontrado.</${Vazio}></${Tela}>`;

  const podeMontar = pode(u, 'frente', proj.local) || pode(u, 'projetos');

function TelaRetirada({ ctx }) {

    if (!assR) return toast('Falta a assinatura do responsável pelo termo.');
    const ops = []; const itensT = [];
    rem.itens.forEach(i => { const q = Math.min(Number(qt[i.key]) || 0, Math.max(0, cd[i.key] || 0)) || 0; if (q <= 0) return;
      const mv = movFIFO('retirada', i.key, q, 'F:' + rem.destino, 'COL:' + rem.destino, rem.id, respNome); const nfs = {}; mv.forEach(o => { nfs[o.doc.nf] = (nfs[o.doc.nf] || 0) + o.doc.qtd; ops.push(o); });
      itensT.push({ key: i.key, qtd: q, nfs, desc: descPeca(i.key), nfTxt: nfsTexto(nfs), porNF: porNF(nfs) }); });
    if (!itensT.length) return toast('Essas peças não estão mais na frente.');

    termo.pastas = pastasTermo({ termo, destino: rem.destino }); termo.nfsTxt = [...new Set(itensT.flatMap(i => Object.keys(i.nfs || {})))].map(nomeNF).join(', ');
    const r = Object.assign({}, rem, { itens: rem.itens.map(i => Object.assign({}, i, { enviado: (itensT.find(x => x.key === i.key) || {}).qtd || 0 })), status: 'retirado', retiradoEm: em, retiradoPor: termo.colaborador.nome, termo, devolucoes: [],
      drive: { ok: false }, drivePendente: true, historico: (rem.historico || []).concat([{ st: 'retirado', em, por: respNome }]) });

/* ---------- devolução por partes ---------- */
function TelaDevolucao({ ctx }) {
  const { usuario: u, ir } = ctx; useStore();
  const rem = store.pegar('remessas', ctx.nav.p.id);
  const [qt, setQt] = useState({}); const [visto, setVisto] = useState(null); const [quem, setQuem] = useState(u.nome); const [feito, setFeito] = useState(null);
  if (feito) return html`<${Tela} ctx=${ctx} eyebrow=${'Devolução · ' + feito.numero} titulo="Termo atualizado" voltar=${() => ir('pedidos')}><${TermosProntos} r=${feito} /></${Tela}>`;
  if (!rem || !rem.termo || rem.status !== 'retirado') return html`<${Tela} ctx=${ctx} titulo="Devolução" voltar=${() => ir('pedidos')}><${Vazio}>${rem && rem.status === 'quitado' ? 'Este termo já foi quitado.' : 'Termo não encontrado.'}</${Vazio}></${Tela}>`;
  const dv = devolvidoTermo(rem); const t = totaisTermo(rem); const n = (rem.devolucoes || []).length + 1;
  const comEle = (i) => Math.max(0, i.qtd - (dv[i.key] || 0));
  const total = rem.termo.itens.reduce((a, i) => a + Math.min(Number(qt[i.key]) || 0, comEle(i)), 0);
  const tudo = () => { const o = {}; rem.termo.itens.forEach(i => o[i.key] = comEle(i)); setQt(o); };
  const confirmar = () => {
    if (!total) return toast('Diga quantas peças estão voltando.');
    if (!visto) return toast('Falta o visto do almoxarifado.');
    const ops = []; const itens = {}; const em = agoraISO();
    rem.termo.itens.forEach(i => { const q = Math.min(Number(qt[i.key]) || 0, comEle(i)); if (q <= 0) return; itens[i.key] = q;
      // volta para o CD respeitando as notas da retirada
      const jaNF = {}; let jaVoltou = dv[i.key] || 0; Object.keys(i.nfs || {}).forEach(nf => { const x = Math.min(jaVoltou, i.nfs[nf]); jaNF[nf] = x; jaVoltou -= x; });
      let resta = q; Object.keys(i.nfs || {}).forEach(nf => { if (resta <= 0) return; const livre = i.nfs[nf] - (jaNF[nf] || 0); const x = Math.min(resta, livre); if (x > 0) { ops.push(movimento('devolucao', i.key, x, 'COL:' + rem.destino, 'F:' + rem.destino, rem.id, quem, { nf })); resta -= x; } });

const TIPO_PEND = { falta: 'Falta', sobra: 'Sobra', avaria: 'Avaria', perda: 'Perdida' };
function ResolverPendencia({ p, u, aoFechar }) {
  const faltaLike = p.tipo === 'falta' || p.tipo === 'perda';
  const [txt, setTxt] = useState(''); const [acao, setAcao] = useState(faltaLike ? 'encontrada' : p.tipo === 'avaria' ? 'cobrada' : 'ok');
  const salvar = () => {
    const ops = [{ c: 'pendencias', doc: Object.assign({}, p, { status: 'resolvida', resolucao: ({ encontrada: 'Peças encontradas', perda: 'Perda confirmada', contestada: 'Contestado com o fornecedor', ok: 'Sobra conferida', cobrada: 'Avaria acertada com a empresa', consertada: 'Peça consertada / sem custo' })[acao] + (txt ? ' — ' + txt : ''), resolvidaEm: agoraISO(), resolvidaPor: u.nome }) }];
    const pend = saldoLugar('PEND:' + p.id)[p.key] || 0;
    const nota = p.ref && store.pegar('notas', p.ref);
    if (pend > 0) {
      const nt = p.ref && store.pegar('notas', p.ref); const destino = 'F:' + (p.local && !['Recebimento', 'CD', 'Coleta'].includes(p.local) ? p.local : (nt && nt.local) || 'Sem local');
      if (acao === 'encontrada') movFIFO('ajuste', p.key, pend, 'PEND:' + p.id, destino, p.id, u.nome).forEach(o => ops.push(o));
      if (acao === 'perda') movFIFO('perda', p.key, pend, 'PEND:' + p.id, 'PERDA', p.id, u.nome).forEach(o => ops.push(o));
    } else if (p.tipo === 'falta' && nota) {
      // falta da conferência da nota: as peças nunca entraram
      if (acao === 'encontrada') ops.push(movimento('entrada', p.key, p.qtd, 'NF', 'F:' + (nota.local || 'Sem local'), nota.id, u.nome, { nf: nota.id }));
      if (acao === 'perda') ops.push(movimento('perda', p.key, p.qtd, 'NF', 'PERDA', nota.id, u.nome, { nf: nota.id }));
    }
    store.gravarVarios(ops); toast('Pendência resolvida.'); aoFechar();
  };
  return html`<${Sheet} titulo="Resolver pendência" aoFechar=${aoFechar} rodape=${html`<button className="btn block" onClick=${salvar}>Salvar</button>`}>
    <div><div className="t1">${TIPO_PEND[p.tipo] || p.tipo} · ${p.qtd} × ${descItem(p.key)}</div><div className="t2">${p.origem} · ${p.obs || ''}</div></div>
    ${(p.fotos || []).length > 0 && html`<${FotosMini} ids=${p.fotos} />`}
    <div className="chips">${(faltaLike ? [['encontrada', 'Peças encontradas'], ['perda', 'Perda confirmada'], ['contestada', 'Contestado c/ fornecedor']] : p.tipo === 'avaria' ? [['cobrada', 'Acertada com a empresa'], ['consertada', 'Consertada / sem custo']] : [['ok', 'Sobra conferida']]).map(([k, l]) => html`<button key=${k} className=${'chip' + (acao === k ? ' on' : '')} onClick=${() => setAcao(k)}>${l}</button>`)}</div>
    <label className="f"><span className="lb">Observação</span><textarea className="inp" value=${txt} onChange=${(e) => setTxt(e.target.value)}></textarea></label>
  </${Sheet}>`;
}

// Monta as páginas medindo de verdade quanto cabe em cada folha A4
async function paginasPDF(d) {
  const pagina = fabricaPaginaPDF(d); const n = d.itens.length;
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;left:-20000px;top:0;width:794px;z-index:-1';
  document.body.appendChild(box);
  const cabe = (pg, p) => { box.innerHTML = '<style>.pg>*{flex-shrink:0}</style>' + pagina(pg, p, 9); const el = box.querySelector('.pg'); return el.scrollHeight <= 1124; };
  const pags = []; let ini = 0;
  try {
    while (true) {
      const p = pags.length;
      if (cabe({ ini, fim: n, ultima: true }, p)) { pags.push({ ini, fim: n, ultima: true }); break; }
      // a tabela inteira cabe, só a ocorrência/assinaturas não: elas vão para a página seguinte
      if (cabe({ ini, fim: n, ultima: false }, p)) { pags.push({ ini, fim: n, ultima: false }, { ini: n, fim: n, ultima: true }); break; }
      let fim = n - 1; while (fim > ini + 1 && !cabe({ ini, fim, ultima: false }, p)) fim--;
      if (fim <= ini) fim = ini + 1;
      pags.push({ ini, fim, ultima: false }); ini = fim;
      if (pags.length > 40) break;
    }
  } finally { box.remove(); }
  return pags.map((pg, p) => pagina(pg, p, pags.length));
}

async function fotografar(htmlStr, largura) {
  await loadScript(LIB_H2C);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + largura + 'px;z-index:-1';
  box.innerHTML = '<style>.pg>*{flex-shrink:0}</style>' + htmlStr; document.body.appendChild(box);
  try {
    await Promise.all([...box.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    return await window.html2canvas(box.querySelector('style') ? box.children[1] : box.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
  } finally { box.remove(); }
}
async function gerarImagemRelatorio(d) { const c = await fotografar(htmlImagem(d), 540); return await new Promise(r => c.toBlob(r, 'image/png')); }
async function gerarPDFRelatorio(d, aoProgresso) {
  await loadScript(LIB_JSPDF);
  const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
  const pags = await paginasPDF(d);
  for (let i = 0; i < pags.length; i++) {

    const c = await fotografar(pags[i], 794);

async function compartilharArquivo(blob, nome, titulo) {
  const file = new File([blob], nome, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: titulo }); return 'compartilhado'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelado'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); return 'baixado';
}

    <button className="btn block" disabled=${!!ocup} onClick=${pdf}><${Ic} n="download" s=${18} />${ocup || 'Relatório desta frente (PDF)'}</button>`;

async function paginasMensal(docs, mes) {

      tot.map(([d, r]) => '<tr><td style="padding:5px 6px;font-weight:600">' + esc(d.local) + '</td><td style="padding:5px 6px">' + esc(d.por) + ' · ' + fmtDataCurta(dataLocal(new Date(d.em))) + '</td><td style="padding:5px 6px;text-align:right">' + r.esp + '</td><td style="padding:5px 6px;text-align:right">' + r.cont + '</td><td style="padding:5px 6px;text-align:right;color:#7A1556">' + (r.perd || '—') + '</td><td style="padding:5px 6px;text-align:right;color:#7A1556">' + (r.dan || '—') + '</td><td style="padding:5px 6px;text-align:right">' + (r.val ? brl(r.val) : '—') + '</td></tr>').join('') + '</table>', 'Conferência mensal · ' + nomeMes(mes)));

function RelatorioMensal({ ctx }) {
  const { ir, nav } = ctx; useStore(); const mes = nav.p.mes; const docs = store.todos('conferencias').filter(c => c.mes === mes).sort((a, b) => a.local.localeCompare(b.local, 'pt-BR'));

  const s = docs.map(resumoConf).reduce((a, r) => ({ esp: a.esp + r.esp, cont: a.cont + r.cont, perd: a.perd + r.perd, dan: a.dan + r.dan }), { esp: 0, cont: 0, perd: 0, dan: 0 });
  return html`<${Tela} ctx=${ctx} eyebrow="Conferência mensal" titulo=${nomeMes(mes)} voltar=${() => ir('conf')}>
    <div className="card pad" style=${{ gap: 4 }}><div className="t1">${nfmt(s.cont)} de ${nfmt(s.esp)} peças conferidas</div><div className="t2">${plural(s.perd, 'perdida', 'perdidas')} · ${plural(s.dan, 'danificada', 'danificadas')} · ${plural(docs.length, 'frente', 'frentes')}</div></div>
    <div className="card">${docs.map(d => { const r = resumoConf(d); return html`<button key=${d.id} className="row" onClick=${() => ir('conf', 'local', { local: d.local, mes })}><span className="grow"><div className="t1">${d.local}</div><div className="t2">${d.por} · ${fmtDataCurta(dataLocal(new Date(d.em)))} · ${r.cont} de ${r.esp}</div></span><span className=${'tag ' + (r.perd || r.dan ? 'm' : 'ok')}>${r.perd || r.dan ? (r.perd + r.dan) + ' com problema' : 'ok'}</span><span className="chev">›</span></button>`; })}</div>
    <button className="btn block" disabled=${!!ocup || !docs.length} onClick=${pdf}><${Ic} n="download" s=${18} />${ocup || 'Relatório completo (PDF)'}</button>

/* ================= PROJETO × NOTA (lista de material do projeto) ================= */
async function listaDoProjetoPDF(file) {
  try {
    await loadScript(LIBS.pdfjs); window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfworker;
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      const its = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str.trim(), x: i.transform[4], y: i.transform[5], h: Math.abs(i.transform[3]) || 8, w: i.width }));
      its.filter(i => /^descri[cç][aã]o/i.test(i.s)).forEach(hd => {
        const q = its.filter(i => /^quantidade$/i.test(i.s) && Math.abs(i.y - hd.y) < hd.h * 0.8 && i.x > hd.x).sort((a, b) => a.x - b.x)[0]; if (!q) return;
        const passo = hd.h * 1.1, fimX = q.x + Math.max(q.w, 40) + 20;
        const abaixo = its.filter(i => i.y < hd.y - 1 && i.x >= hd.x - 5 && i.x < fimX).sort((a, b) => b.y - a.y);
        let yAnt = hd.y; const linhas = [];
        for (const it of abaixo) { if (yAnt - it.y > passo * 3.2 || /^descri[cç][aã]o/i.test(it.s)) break; let l = linhas.find(x => Math.abs(x.y - it.y) < hd.h * 0.6); if (!l) { l = { y: it.y, d: [], q: [] }; linhas.push(l); } if (it.x >= q.x - 15) l.q.push(it.s); else l.d.push(it); yAnt = it.y; }
        linhas.forEach(l => { const desc = l.d.sort((a, b) => a.x - b.x).map(x => x.s).join(' ').replace(/\s+/g, ' ').trim(); const qtd = parseInt(l.q.join('').replace(/\D/g, ''), 10); if (desc && !/^total/i.test(desc) && qtd > 0) out.push({ desc, qtd }); });
      });
    }
    return out;
  } catch (e) { console.warn('lista do projeto', e); return []; }
}
const chaveDesc = (s) => norm(s).replace(/[^a-z0-9]/g, '');
function difProjetoNota(nota) {
  const refs = nota.projetosRef || []; if (!refs.length) return null;
  const projs = store.todos('projetos').filter(p => p.numero && refs.includes(p.numero) && (p.lista || []).length); if (!projs.length) return null;
  const proj = {}; const nomes = {}; projs.forEach(p => p.lista.forEach(l => { const k = chaveDesc(l.desc); proj[k] = (proj[k] || 0) + l.qtd; nomes[k] = nomes[k] || l.desc; }));
  const nf = {}; (nota.itens || []).forEach(i => { const k = chaveDesc(i.desc); nf[k] = (nf[k] || 0) + i.qtd; nomes[k] = nomes[k] || i.desc; });
  const dif = []; let iguais = 0;
  new Set(Object.keys(proj).concat(Object.keys(nf))).forEach(k => { const a = proj[k] || 0, b = nf[k] || 0; if (a === b) iguais++; else dif.push({ desc: nomes[k], proj: a, nota: b }); });
  dif.sort((x, y) => Math.abs(y.nota - y.proj) - Math.abs(x.nota - x.proj));
  return { dif, iguais, projetos: [...new Set(projs.map(p => 'PJ ' + p.numero))] };
}
function AvisoProjetoNota({ nota }) {
  const d = difProjetoNota(nota); const [todos, setTodos] = useState(false);
  if (!d || !d.dif.length) return null;
  const lista = todos ? d.dif : d.dif.slice(0, 6);
  return html`<div className="card pad" style=${{ gap: 10, boxShadow: 'inset 0 0 0 1.5px #B8962E' }}>
    <div style=${{ display: 'flex', alignItems: 'center', gap: 10 }}><span style=${{ width: 32, height: 32, borderRadius: 10, background: '#FBF3DD', color: '#5C4300', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>!</span><span className="grow"><div style=${{ fontSize: 15, fontWeight: 700 }}>Projeto × nota: ${plural(d.dif.length, 'diferença', 'diferenças')}</div><div className="t2">NF ${nota.numero} · ${d.projetos.join(', ')} · ${nota.local || ''}</div></span></div>
    <table style=${{ width: '100%', borderCollapse: 'collapse', fontSize: 12.5 }}><tbody><tr className="t3"><td style=${{ padding: '4px 0' }}>Peça</td><td style=${{ textAlign: 'right' }}>Projeto</td><td style=${{ textAlign: 'right' }}>Nota</td><td style=${{ textAlign: 'right' }}>Dif.</td></tr>
      ${lista.map((x, ix) => { const df = x.nota - x.proj; return html`<tr key=${ix} style=${{ borderTop: '1px solid var(--line2)' }}><td style=${{ padding: '7px 4px 7px 0' }}>${x.desc}</td><td style=${{ textAlign: 'right' }}>${x.proj || '—'}</td><td style=${{ textAlign: 'right' }}>${x.nota || '—'}</td><td style=${{ textAlign: 'right', fontWeight: 700, color: df < 0 ? 'var(--mag-t)' : '#243B8F', whiteSpace: 'nowrap' }}>${!x.nota ? 'não veio' : !x.proj ? 'fora do projeto' : (df > 0 ? '+' : '') + df}</td></tr>`; })}</tbody></table>
    ${d.dif.length > 6 && html`<button className="link" style=${{ padding: 0, alignSelf: 'flex-start' }} onClick=${() => setTodos(!todos)}>${todos ? 'Mostrar menos' : 'Ver todas (' + d.dif.length + ')'}</button>`}
    <span className="t3">${d.iguais ? 'As outras ' + d.iguais + ' peças batem. ' : ''}Confira na fábrica antes de carregar.</span></div>`;
}
